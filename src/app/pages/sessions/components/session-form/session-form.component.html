<div class="form-wrapper">

  <div class="form-card">

    <div class="form-header">
      <h2>➕ Add New Session</h2>
      <p>Create a new training session</p>
    </div>

    <form (ngSubmit)="submit()" #sessionForm="ngForm">

      <!-- TYPE -->
      <div class="field">
        <label>Session Type</label>
        <select
          [(ngModel)]="session.type"
          name="type"
          required
          (change)="onTypeChange()"
        >
          <option value="ONLINE">🌐 ONLINE</option>
          <option value="ONSITE">🏫 ONSITE</option>
        </select>
      </div>

      <!-- START DATE -->
      <div class="field">
        <label>Start Date & Time</label>
        <input
          type="datetime-local"
          [(ngModel)]="session.startAt"
          name="startAt"
          required
        />
      </div>
      <!-- DURATION -->
<div class="field">
  <label>Duration (hours)</label>
  <input
    type="number"
    [(ngModel)]="durationHours"
    name="durationHours"
    min="1"
    step="1"
    required
    (input)="onDurationChange()"
  />
</div>



      <!-- END DATE -->
      <div class="field">
        <label>End Date & Time</label>
        <input
          type="datetime-local"
          [(ngModel)]="session.endAt"
          name="endAt"
          required
        />
      </div>

      <!-- CAPACITY -->
      <div class="field">
        <label>Capacity</label>
        <input
          type="number"
          [(ngModel)]="session.capacity"
          name="capacity"
          placeholder="Enter number of participants"
          required
        />
      </div>

      <!-- SALLE (VISIBLE ONLY IF ONSITE) -->
      <div class="field" *ngIf="session.type === 'ONSITE'">
        <label>Select Salle</label>

        <select [(ngModel)]="session.salle" name="salle" required>
          <option *ngFor="let s of salles" [ngValue]="{ id: s.id }">
            {{ s.name }} ({{ s.capacity }} places)
          </option>
        </select>
      </div>

      <!-- ACTIONS -->
      <div class="actions">
        <button type="submit" class="save-btn">
          💾 Save Session
        </button>

        <button type="button" routerLink="/sessions" class="cancel-btn">
          Cancel
        </button>
      </div>

    </form>

  </div>

</div>
