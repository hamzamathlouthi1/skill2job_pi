<div class="navbar">

  <!-- LEFT -->
  <div class="welcome">
    Welcome back <strong>{{ currentUser?.username }}</strong>
  </div>

  <!-- RIGHT -->
  <div class="right">

    <div class="profile-menu" (click)="toggleProfileMenu()">
      <div class="profile-icon-wrapper">

        <div class="profile-circle">
          {{ getInitials(currentUser?.username || 'T') }}
        </div>

        <div class="profile-text">
          <span class="profile-name">{{ currentUser?.username || 'Trainer' }}</span>
          <!-- ✅ email supprimé — pas dans JwtResponse -->
        </div>

      </div>
    </div>

    <div class="profile-dropdown" *ngIf="isProfileMenuOpen">
      <a routerLink="/trainer/profile">Profile</a>
      <a routerLink="/trainer/settings">Settings</a>
      <a (click)="logout()" style="cursor:pointer;">Logout</a>
    </div>

  </div>

</div>
