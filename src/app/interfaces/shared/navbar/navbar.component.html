<div class="navbar">
  
  <!-- LEFT TEXT -->
  <div class="welcome">
    Welcome back  {{ currentUser?.username  }}
  </div>
  
  <!-- RIGHT SIDE -->
  <div class="right">
    
    <!-- PROFILE MENU (clickable) -->
    <div class="profile-menu" (click)="toggleProfileMenu()">
      
      <div class="profile-icon-wrapper">
        
        <!-- Profile circle with initials -->
        <div class="profile-circle">
          {{ getInitials(currentUser?.username || 'U') }}
        </div>
        
        <!-- Profile text info (hidden on mobile if needed) -->
        <div class="profile-text">
          <span class="profile-name">
            {{ currentUser?.username || 'Guest' }}
          </span>
          
          <span class="profile-email">
            {{ currentUser?.email || 'guest@skill2job.com' }}
          </span>
        </div>
        
      </div>
      
    </div>
    
    <!-- Optional dropdown menu when clicked -->
    <div class="profile-dropdown" *ngIf="isProfileMenuOpen">
      <a href="/profile">Profile</a>
      <a href="/settings">Settings</a>
      <a (click)="logout()" style="cursor: pointer;">Logout</a>
    </div>
    
  </div>
  
</div>
