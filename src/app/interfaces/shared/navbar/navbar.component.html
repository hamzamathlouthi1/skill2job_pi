<div class="navbar">
  <div class="welcome">
    Welcome Home, <strong>{{ currentUser?.username }}</strong> 👋
  </div>

  <div class="right">
    <div class="profile-wrapper">
      <!-- Avatar -->
      <div class="profile" (click)="toggleDropdown($event)">
        {{ currentUser?.username?.charAt(0)?.toUpperCase() }}
      </div>

      <!-- Dropdown - Added stopPropagation -->
      <div class="dropdown-menu" *ngIf="isDropdownOpen" (click)="$event.stopPropagation()">
        <div class="dropdown-user">
          <strong>{{ currentUser?.username }}</strong>
          <small>{{ currentUser?.email }}</small>
        </div>
        
        <!-- Logout Button - Added click handler directly -->
        <button class="dropdown-item logout" (click)="logout($event)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1-2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
          <span>Logout</span>
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Backdrop -->
<div class="backdrop" *ngIf="isDropdownOpen" (click)="closeDropdown()"></div>
