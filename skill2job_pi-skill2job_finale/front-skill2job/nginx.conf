server {
    listen 80;

    # Proxy all API calls to the Spring Cloud Gateway (same Docker network)
    # This eliminates CORS entirely: the browser sees everything on port 80
    location /api/ {
        proxy_pass http://api-gateway:8090/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;

        # Allow large payloads (file uploads, etc.)
        client_max_body_size 50M;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # Proxy WebSocket connections
    location /ws/ {
        proxy_pass http://api-gateway:8090/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }

    # Angular SPA – serve index.html for all other routes
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
