version: '3.8'

networks:
  exams-network:
    driver: bridge

volumes:
  mysql_exams_data:
  prometheus_exams_data:
  grafana_exams_data:

services:
  # MySQL for Exams only
  mysql-exams:
    image: mysql:8.0
    container_name: mysql-exams
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: exams_db
    ports:
      - "3307:3306"  # Different port to avoid conflict with other services
    volumes:
      - mysql_exams_data:/var/lib/mysql
    networks:
      - exams-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Your Exams Service
  exams-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: exams-service
    ports:
      - "8082:8082"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-exams:3306/exams_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - SERVER_PORT=8082
      # Prometheus metrics endpoint
      - MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE=health,info,prometheus
      - MANAGEMENT_METRICS_EXPORT_PROMETHEUS_ENABLED=true
      - MANAGEMENT_PROMETHEUS_METRICS_EXPORT_ENABLED=true
    depends_on:
      mysql-exams:
        condition: service_healthy
    networks:
      - exams-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.exams.rule=PathPrefix(`/api/exams`)"
      - "traefik.http.services.exams.loadbalancer.server.port=8082"
      - "traefik.http.routers.exams.middlewares=exams-stripprefix"
      - "traefik.http.middlewares.exams-stripprefix.stripprefix.prefixes=/api/exams"

  # Traefik Reverse Proxy
  traefik:
    image: traefik:v3.0
    container_name: traefik-exams
    command:
      - "--api.insecure=true"  # Enable dashboard
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--log.level=DEBUG"  # Helpful for debugging
    ports:
      - "80:80"           # HTTP traffic
      - "8081:8080"       # Traefik dashboard (different port)
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    networks:
      - exams-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik-dashboard.rule=PathPrefix(`/traefik`)"
      - "traefik.http.routers.traefik-dashboard.service=api@internal"
      - "traefik.http.routers.traefik-dashboard.middlewares=auth"
      - "traefik.http.middlewares.auth.basicauth.users=admin:$$2y$$10$$YOUR_HASHED_PASSWORD"  # Generate with: htpasswd -nb admin admin

  # Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus-exams
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_exams_data:/prometheus
    ports:
      - "9091:9090"  # Different port to avoid conflicts
    networks:
      - exams-network
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
    depends_on:
      - exams-service

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: grafana-exams
    ports:
      - "3001:3000"  # Different port to avoid conflicts
    networks:
      - exams-network
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana_exams_data:/var/lib/grafana
      - ./grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
      - ./grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml
      - ./dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
