apiVersion: apps/v1
kind: Deployment
metadata:
  name: gestion-sessions
  namespace: skill2job
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gestion-sessions
  template:
    metadata:
      labels:
        app: gestion-sessions
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8085"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      containers:
        - name: gestion-sessions
          image: hamzamathlouthi/gestion-sessions:latest
          ports:
            - containerPort: 8085
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8085
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8085
            initialDelaySeconds: 30
            periodSeconds: 20
