spring.application.name=api_gateway_pi
server.port=8090

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# CORS is handled by CorsConfig.java (CorsWebFilter bean)

# ── Auth & User (GestionUser service) ────────────────────────────────────────
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://gestionuser
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**

spring.cloud.gateway.routes[1].id=users-service
spring.cloud.gateway.routes[1].uri=lb://gestionuser
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/users/**

