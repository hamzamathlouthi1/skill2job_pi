spring.application.name=api_gateway_pi
server.port=8090

# ================= EUREKA =================
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# ================= GATEWAY DISCOVERY =================
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# ================= EXAMS =================
spring.cloud.gateway.routes[0].id=exams-service
spring.cloud.gateway.routes[0].uri=lb://exams-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/exams/**

# ================= SESSION =================
spring.cloud.gateway.routes[1].id=session-service
spring.cloud.gateway.routes[1].uri=lb://session-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/session/**

spring.cloud.gateway.routes[2].id=salles
spring.cloud.gateway.routes[2].uri=lb://session-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/salles/**

spring.cloud.gateway.routes[3].id=equipments
spring.cloud.gateway.routes[3].uri=lb://session-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/equipments/**

spring.cloud.gateway.routes[4].id=blocs
spring.cloud.gateway.routes[4].uri=lb://session-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/blocs/**

spring.cloud.gateway.routes[5].id=pc-search
spring.cloud.gateway.routes[5].uri=lb://session-service
spring.cloud.gateway.routes[5].predicates[0]=Path=/pc/**

spring.cloud.gateway.routes[6].id=websocket
spring.cloud.gateway.routes[6].uri=lb://session-service
spring.cloud.gateway.routes[6].predicates[0]=Path=/ws/**

spring.cloud.gateway.routes[7].id=sessions
spring.cloud.gateway.routes[7].uri=lb://session-service
spring.cloud.gateway.routes[7].predicates[0]=Path=/api/sessions/**

spring.cloud.gateway.routes[8].id=rooms
spring.cloud.gateway.routes[8].uri=lb://session-service
spring.cloud.gateway.routes[8].predicates[0]=Path=/api/rooms/**

# ================= AUTH / USERS / ADMIN =================
spring.cloud.gateway.routes[9].id=auth-service
spring.cloud.gateway.routes[9].uri=lb://partner-service
spring.cloud.gateway.routes[9].predicates[0]=Path=/api/auth/**

spring.cloud.gateway.routes[10].id=users-service
spring.cloud.gateway.routes[10].uri=lb://partner-service
spring.cloud.gateway.routes[10].predicates[0]=Path=/api/users/**

spring.cloud.gateway.routes[11].id=admin-service
spring.cloud.gateway.routes[11].uri=lb://partner-service
spring.cloud.gateway.routes[11].predicates[0]=Path=/api/admin/**

# ================= PARTNER / OFFERS / NOTIFICATIONS =================
spring.cloud.gateway.routes[12].id=partner-service
spring.cloud.gateway.routes[12].uri=lb://partner-service
spring.cloud.gateway.routes[12].predicates[0]=Path=/api/partner/**,/api/partners/**,/api/offers/**,/api/job-offers/**,/api/notifications/**

# ================= LEARNER/PARTNER APPLICATIONS (partner-service) =================
spring.cloud.gateway.routes[13].id=partner-applications
spring.cloud.gateway.routes[13].uri=lb://partner-service
spring.cloud.gateway.routes[13].predicates[0]=Path=/api/applications/me,/api/applications/has-applied/**,/api/applications

# ================= TRAINER APPLICATIONS (recruitment) =================
spring.cloud.gateway.routes[14].id=recruitment-applications
spring.cloud.gateway.routes[14].uri=lb://recruitment
spring.cloud.gateway.routes[14].predicates[0]=Path=/api/applications/exists,/api/applications/{id},/api/applications/{id}/**,/api/applications?*

spring.cloud.gateway.routes[15].id=recruitment-trainer-details
spring.cloud.gateway.routes[15].uri=lb://recruitment
spring.cloud.gateway.routes[15].predicates[0]=Path=/api/admin/trainer-details/**

spring.cloud.gateway.routes[16].id=recruitment-trainer-profile
spring.cloud.gateway.routes[16].uri=lb://recruitment
spring.cloud.gateway.routes[16].predicates[0]=Path=/api/trainer-profile/**

spring.cloud.gateway.routes[17].id=recruitment-messages
spring.cloud.gateway.routes[17].uri=lb://recruitment
spring.cloud.gateway.routes[17].predicates[0]=Path=/api/messages/**