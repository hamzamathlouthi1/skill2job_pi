spring.application.name=api_gateway_pi
server.port=8090

eureka.client.service-url.defaultZone=http://localhost:8761/eureka

spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# Exams
spring.cloud.gateway.routes[0].id=exams-service
spring.cloud.gateway.routes[0].uri=lb://exams-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/exams/**

# Session
spring.cloud.gateway.routes[1].id=session-service
spring.cloud.gateway.routes[1].uri=lb://session-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/session/**

# Auth
spring.cloud.gateway.routes[2].id=auth-service
spring.cloud.gateway.routes[2].uri=lb://session-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/auth/**

# Admin
spring.cloud.gateway.routes[3].id=admin-service
spring.cloud.gateway.routes[3].uri=lb://session-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/admin/**

# Formation
spring.cloud.gateway.routes[4].id=formation-service
spring.cloud.gateway.routes[4].uri=lb://formation-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/formation/**

# Trainer
spring.cloud.gateway.routes[5].id=trainer-service
spring.cloud.gateway.routes[5].uri=lb://trainer-service
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/trainer/**

# Partner
spring.cloud.gateway.routes[6].id=partner-service
spring.cloud.gateway.routes[6].uri=lb://partner-service
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/partner/**

# Salles
spring.cloud.gateway.routes[7].id=salles
spring.cloud.gateway.routes[7].uri=lb://session-service
spring.cloud.gateway.routes[7].predicates[0]=Path=/api/salles/**

# Equipments
spring.cloud.gateway.routes[8].id=equipments
spring.cloud.gateway.routes[8].uri=lb://session-service
spring.cloud.gateway.routes[8].predicates[0]=Path=/api/equipments/**

# Blocs
spring.cloud.gateway.routes[9].id=blocs
spring.cloud.gateway.routes[9].uri=lb://session-service
spring.cloud.gateway.routes[9].predicates[0]=Path=/api/blocs/**

# PC Search
spring.cloud.gateway.routes[10].id=pc-search
spring.cloud.gateway.routes[10].uri=lb://session-service
spring.cloud.gateway.routes[10].predicates[0]=Path=/pc/**

# WebSocket
spring.cloud.gateway.routes[11].id=websocket
spring.cloud.gateway.routes[11].uri=lb://session-service
spring.cloud.gateway.routes[11].predicates[0]=Path=/ws/**

# Sessions (plural)
spring.cloud.gateway.routes[12].id=sessions
spring.cloud.gateway.routes[12].uri=lb://session-service
spring.cloud.gateway.routes[12].predicates[0]=Path=/api/sessions/**

# Rooms
spring.cloud.gateway.routes[13].id=rooms
spring.cloud.gateway.routes[13].uri=lb://session-service
spring.cloud.gateway.routes[13].predicates[0]=Path=/api/rooms/**

# CORS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins=http://localhost:4200
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allow-credentials=true